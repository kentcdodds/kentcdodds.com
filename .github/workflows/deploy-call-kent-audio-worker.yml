name: ⚙️ Deploy Call Kent Audio Worker

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: ⚙️ Deploy Call Kent Audio Worker
    runs-on: ubuntu-latest
    environment: call-kent-audio-worker-production
    concurrency:
      group: deploy-call-kent-audio-worker-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 📥 Install audio worker deps
        run: bun install --frozen-lockfile

      - name: 🔬 Lint audio worker
        run: bun run --filter call-kent-audio-worker lint

      - name: ʦ Typecheck audio worker
        run: bun run --filter call-kent-audio-worker typecheck

      - name: 🧪 Test audio worker
        run: bun run --filter call-kent-audio-worker test

      - name: ☁️ Deploy via Wrangler
        working-directory: services/call-kent-audio-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
