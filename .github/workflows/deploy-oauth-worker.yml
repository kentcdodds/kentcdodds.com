name: 🔐 Deploy OAuth Worker

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: 🔐 Deploy OAuth Worker
    runs-on: ubuntu-latest
    environment: oauth-production
    concurrency:
      group: deploy-oauth-worker-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 📥 Install OAuth worker deps
        run: bun install --frozen-lockfile

      - name: 🔬 Lint OAuth worker
        run: bun run --filter oauth lint

      - name: ʦ Typecheck OAuth worker
        run: bun run --filter oauth typecheck

      - name: ☁️ Deploy via Wrangler
        working-directory: services/oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --env production
