name: Validate Site Worker

on:
  pull_request:
    paths:
      - .github/workflows/validate-site-worker.yml
      - bun.lock
      - package.json
      - services/site/app/**
      - services/site/other/mdx-artifacts/**
      - services/site/migrations/**
      - services/site/vite.config.ts
      - services/site-worker/**
  workflow_dispatch:

jobs:
  validate:
    name: Validate Site Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install site worker deps
        run: bun install --frozen-lockfile

      - name: Lint site worker
        run: bun run --filter site-worker lint

      - name: Typecheck site worker
        run: bun run --filter site-worker typecheck

      - name: Test site worker
        run: bun run --filter site-worker test

      - name: Validate local D1 migrations
        working-directory: services/site-worker
        env:
          CI: "true"
        run: bun run d1:migrations:apply:local

      - name: Wrangler deploy dry run
        run: bun run --filter site-worker dry-run
